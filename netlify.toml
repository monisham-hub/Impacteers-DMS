# ==============================================================================
# Impacteers DMS — Production Netlify Deployment Configuration
# ==============================================================================

[build]
  # Root directory contains index.html and static assets
  publish = "."
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_STORAGE_BUCKET,FIREBASE_API_KEY,FIREBASE_APP_ID,FIREBASE_MEASUREMENT_ID,gemini_api_key"
  SECRETS_SCAN_OMIT_PATHS = "src/js/firebaseConfig.js,package.json,src/js/services/legalAssistantService.js"

# Single Page Application (SPA) Client-Side Hash & Path Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# Enterprise Security & Performance HTTP Headers
# ==============================================================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    # Cross-site scripting (XSS) filter
    X-XSS-Protection = "1; mode=block"
    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Restrict unneeded browser hardware features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Enforce HTTPS across subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy: Allowing Firebase Auth, Firestore, Analytics, Google APIs, and Fonts
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.firebaseio.com https://apis.google.com https://generativelanguage.googleapis.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com;
      connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.firebasestorage.app wss://*.firebaseio.com https://*.supabase.co https://www.gstatic.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net;
      img-src 'self' data: blob: https: https://www.google-analytics.com https://*.googletagmanager.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
    """

# Ensure index.html and all JavaScript files are always fresh (no stale code or cached state)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

[[headers]]
  for = "/src/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache, no-store"

# Cache static CSS & Assets with moderate caching
[[headers]]
  for = "/src/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
