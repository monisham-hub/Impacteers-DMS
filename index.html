<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impacteers DMS — Document Management System</title>
  <meta name="description" content="Secure, enterprise-grade Document Management System for Impacteers combining ticket workflows, version-controlled document repository, contract lifecycle management, and RBAC department isolation." />
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" type="image/png" href="./assets/impacteers-logo.png" />
  <link rel="stylesheet" href="./src/css/app.css" />
  <!-- Import Map for Firebase (ES Modules in Browser) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js",
        "firebase/analytics": "https://www.gstatic.com/firebasejs/10.9.0/firebase-analytics.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"
      }
    }
  </script>
  <!-- Suppress Netlify Drawer / Feedback Badge -->
  <style>
    #netlify-drawer-container,
    iframe[id*="netlify"],
    iframe[src*="netlify"],
    [data-netlify-drawer],
    netlify-drawer,
    div[class*="netlify-drawer"],
    div[class*="netlify-feedback"],
    div:has(> iframe[src*="netlify"]) {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      left: -9999px !important;
    }
  </style>
  <script>
    // Permanently strip Netlify badge/drawer
    const purgeNetlifyBadge = () => {
      document.querySelectorAll(
        '#netlify-drawer-container, iframe[id*="netlify"], iframe[src*="netlify"], [data-netlify-drawer], netlify-drawer, div[class*="netlify-drawer"]'
      ).forEach(el => el.remove());
    };
    purgeNetlifyBadge();
    new MutationObserver(purgeNetlifyBadge).observe(document.documentElement, {
      childList: true,
      subtree: true
    });
  </script>
</head>
<body>
  <!-- Main Application Container -->
  <div id="app">
    <!-- Initial Loading State -->
    <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background: #0F172A; color: #FFFFFF; font-family: 'Inter', sans-serif;">
      <div style="text-align: center;">
        <img src="./assets/impacteers-logo.png" alt="Impacteers Logo" style="height: 54px; width: auto; display: block; margin: 0 auto 16px auto;" />
        <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em; color: #F8FAFC;">Impacteers DMS</div>
        <div style="font-size: 13px; color: #94A3B8; margin-top: 4px; font-weight: 500;">Document Management System</div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Main Application Script (ES Module with cache-busting version) -->
  <script type="module" src="./src/js/app.js?v=7.0.0"></script>
</body>
</html>
